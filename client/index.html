<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0d1a">
  <meta name="color-scheme" content="dark">
  <title>Faster than Lumos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230b0d1a'/%3E%3Ccircle cx='8' cy='8' r='3.2' fill='%23ffcf6e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/client/style.css">
  <script type="module" src="/client/main.js"></script>
</head>
<body data-phase="boot">
  <div id="app">
    <header id="bar">
      <span class="brand"><i class="lamp" aria-hidden="true"></i><span class="brand-name">Faster than Lumos</span></span>
      <span id="bar-match" class="bar-match"></span>
      <span id="bar-vs" class="bar-vs"></span>
      <span class="bar-gap"></span>
      <button id="bar-pause" class="bar-btn" type="button" hidden>Pause</button>
      <button id="bar-menu" class="bar-btn" type="button">Menu</button>
    </header>
    <main id="stage"><canvas id="canvas" aria-label="Battle view"></canvas></main>
    <section id="hud" aria-label="Ship controls" hidden></section>
    <div id="overlay" hidden></div>
  </div>
  <div id="banner" role="status" hidden></div>
</body>
</html>
